[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API berjalan di VPS (MySQL lokal, tidak terbuka ke internet) dan dipanggil lewat proxy.
# Netlify hanya menyajikan tampilan; tidak perlu DATABASE_URL di sini.
# Proxy: https://izinklinik.com/lastdance-api/ -> http://127.0.0.1:3990/api/
[[redirects]]
  from = "/api/*"
  to = "https://izinklinik.com/lastdance-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

